name: Documentation
on:
  push:
    branches: [main, docs]
  pull_request:
    branches: [docs]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Check out documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.ref_name == 'docs' || github.event_name == 'pull_request') && github.sha || 'docs' }}
          path: site
          persist-credentials: false
      - name: Check out component source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name == 'main' && github.sha || 'main' }}
          path: library
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Configure project URL
        id: pages
        uses: actions/configure-pages@v6
      - name: Build the documentation site
        working-directory: site
        env:
          COMPONENTS_ROOT: ${{ github.workspace }}/library
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run prepare:pages --if-present
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/dist
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'docs')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
