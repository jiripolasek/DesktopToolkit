name: Release toolkit
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify packages and galleries from full CI for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the tagged commit.' }
          ./eng/Get-ValidatedReleasePackage.ps1 -Tag $env:RELEASE_TAG -Commit $commit -Repository $env:GITHUB_REPOSITORY -PackageDirectory release-assets | Out-Null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/
          compression-level: 0
          overwrite: true
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish all packages and symbols
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: ./eng/Publish-ReleasePackages.ps1 -Tag $env:RELEASE_TAG -PackageDirectory release-assets
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*.nupkg release-assets/*.snupkg)
          (( ${#assets[@]} > 0 ))
          for arch in x64 arm64; do
            gallery="release-assets/JPSoftworks.DesktopToolkit.Gallery-${RELEASE_TAG#v}-win-$arch.zip"
            [[ -s "$gallery" ]]
            assets+=("$gallery")
          done
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == false ]]; then
              existing=$(mktemp -d)
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing"
              for file in "${assets[@]}"; do cmp "$file" "$existing/${file##*/}"; done
              exit 0
            fi
          else
            options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "JPSoftworks Desktop Toolkit ${RELEASE_TAG#v}" "${options[@]}"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
