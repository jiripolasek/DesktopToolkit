name: Feature request
description: Suggest a new control or an improvement to Desktop Toolkit.
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Choose General issue if no single component applies.
      options:
        - General issue
        - Charts
        - Controls bundle
        - Date and Time Controls
        - InfoLabel
        - KeyVisual
        - Searchable Flyouts
        - Toast Windows
        - WinUI Styles
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Describe what you are trying to do and what is difficult or missing today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the improvement and give a concrete example of how it would work.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Alternatives or additional context
      description: Include any workarounds, alternatives, sample XAML, or relevant screenshots.
